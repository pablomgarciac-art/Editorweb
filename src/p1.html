<title>Editor Web Visual</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Poppins:wght@400;600;700&family=Playfair+Display:wght@600;700&family=Lora:wght@400;600&family=DM+Sans:wght@400;600;700&family=Montserrat:wght@400;600;700&display=swap">
<style>
/* Concepto: barra superior, raíl azul pizarra, cajón de herramientas, lienzo con secciones punteadas y panel de propiedades */
:root{--rail:#66769a;--rail-ink:#eef2f9;--accent:#1db4e8;--bg:#e3e8ef;--panel:#f5f7fa;--panel-2:#ffffff;--line:#d3dae5;--ink:#2b3445;--mute:#66738a;--danger:#d64550;--dash:#2f7fc1;--inbg:#ffffff;--inbd:#9db2c3;--hd:#0b6f9c;--hdl:#0b6f9c;--hdbg:#e4f3fa;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rail:#525a68;--rail-ink:#eceff5;--bg:#2b2f36;--panel:#4c5461;--panel-2:#5a6371;--line:#707a8a;--ink:#eceff4;--mute:#a9b0bc;--dash:#5fb0f0;--inbg:#1f2328;--inbd:#7d8797;--hd:#1d6f94;--hdl:#7fd0f5;--hdbg:#41596b;color-scheme:dark}}
:root[data-theme="dark"]{--inbg:#1f2328;--inbd:#7d8797;--hd:#1d6f94;--hdl:#7fd0f5;--hdbg:#41596b;--rail:#525a68;--rail-ink:#eceff5;--bg:#2b2f36;--panel:#4c5461;--panel-2:#5a6371;--line:#707a8a;--ink:#eceff4;--mute:#a9b0bc;--dash:#5fb0f0;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 'Nunito Sans',system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-rows:52px minmax(0,1fr);grid-template-columns:108px auto minmax(0,1fr) auto;grid-template-areas:"bar bar bar bar" "rail drawer stage props"}
#bar{grid-area:bar;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel-2);border-bottom:1px solid var(--line);min-width:0;overflow-x:auto}
#bar .sp{flex:1}
.brand{font-weight:700;font-size:16px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block}
.b{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;white-space:nowrap;font-weight:600}
.b:hover{border-color:var(--accent)}
.b.pri{background:var(--accent);border-color:var(--accent);color:#06293a}
.b.on{background:var(--accent);border-color:var(--accent);color:#06293a}
.b.sm{padding:6px 10px;font-size:14.5px}
.b.dng{color:var(--danger)}
.b:disabled{opacity:.4;cursor:default}
#devSel{width:150px;text-overflow:ellipsis}
.seg{display:flex;flex:none;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg .b{border:0;border-radius:0}
.stat{font-size:13px;color:var(--mute);white-space:nowrap}
#rail{grid-area:rail;background:var(--rail);display:flex;flex-direction:column;overflow-y:auto}
.ri{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 6px 16px;border:0;background:none;color:var(--rail-ink);font-size:14.5px;font-weight:600;line-height:1.2;text-align:center;cursor:pointer}
.ri:hover{color:#fff}
.ri.on{background:var(--accent);color:#06293a}
#drawer,#props{background:var(--panel);overflow:hidden;width:0}
#drawer{grid-area:drawer;border-right:1px solid rgba(255,255,255,.3)}
#props{grid-area:props;border-left:1px solid var(--line)}
#app.dw #drawer,#app.pw #props{width:350px}
.pin{width:350px;height:100%;overflow-y:auto;padding:0 16px 24px}
.dh{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;margin:0 -16px 14px;padding:14px 16px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:21px;font-weight:600}
.dg{margin:20px 0 10px;font-size:14px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:84px;padding:12px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);color:var(--mute);font-size:15px;text-align:center;cursor:grab}
.tile:hover{border-color:var(--accent);color:var(--ink)}
.tile .h{font-size:21px;font-weight:800;line-height:1}
#props .dg{margin:24px -16px 12px;padding:10px 16px;background:var(--hd);color:#fff;font-size:15px;letter-spacing:.08em}
#props .f>label,#props .f>.l{color:var(--hdl);font-size:14px}
#props .f{padding:8px 10px 10px;background:var(--hdbg);border-radius:8px}
#props .row>.f,#props .f .f{margin-bottom:0}
#props .row:has(>.f){margin-bottom:11px}
#props .f>label.ck{text-transform:none;letter-spacing:0;font-size:16px;color:var(--ink);font-weight:600}
.sgrip{position:absolute;left:0;right:0;bottom:0;height:16px;cursor:ns-resize;z-index:8;display:none;touch-action:none}
.sec:hover>.sgrip,.sec.actsec>.sgrip,.sec.growing>.sgrip{display:block}
.sgrip::after{content:'';position:absolute;left:50%;bottom:3px;width:64px;height:8px;margin-left:-32px;border-radius:6px;background:var(--dash);box-shadow:0 0 0 2px #fff,0 1px 6px rgba(0,0,0,.35)}
.sgrip:hover::after{height:10px;background:var(--accent)}
#frame.m .sec:not(.locked) .sgrip{display:none!important}
.ipick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ipk{aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);color:var(--ink);cursor:pointer;padding:0}
.ipk:hover{border-color:var(--accent)}
.ipk.on{border-color:var(--accent);background:var(--hdbg);color:var(--hdl);box-shadow:0 0 0 2px var(--accent)}
#secpop{position:fixed;z-index:210;width:300px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.4);padding:10px;font:600 14px 'Nunito Sans',sans-serif}#secpop[hidden]{display:none}#secpop .spt{font-weight:800;padding:4px 6px 8px;color:var(--mute)}#secpop .spr{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:8px}#secpop .spr:hover{background:var(--panel)}#secpop .spn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#linkpop{position:fixed;z-index:200;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.4);padding:14px;max-height:calc(100vh - 16px);overflow:auto}
#linkpop[hidden]{display:none}
.lph{display:flex;align-items:center;justify-content:space-between;font-size:17px;margin-bottom:10px}
.lpk{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lpb{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font:600 14px inherit;line-height:1.2;font-family:inherit;cursor:pointer;text-align:left}
.lpb svg{flex:none}
.lpb:hover{border-color:var(--accent)}
.lpb.on{border-color:var(--accent);background:var(--hdbg);color:var(--hdl);box-shadow:0 0 0 1px var(--accent)}
.lpf{margin-top:12px;padding:10px;border-radius:9px;background:var(--hdbg)}
.lpf .f{margin-bottom:8px}
.lpa{display:flex;justify-content:flex-end;margin-top:12px}
.etb .ib.on{color:var(--accent);background:var(--hdbg)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.nstep{display:flex;gap:5px;align-items:stretch;width:100%}
.nstep input{flex:1;min-width:0;text-align:center}
.nb{flex:none;width:36px;border:1.5px solid var(--inbd,var(--line));border-radius:6px;background:var(--panel-2);color:var(--ink);font:700 20px/1 inherit;font-family:inherit;cursor:pointer;padding:0}
.nb:hover{border-color:var(--accent);color:var(--accent)}
.hint{font-size:14.5px;color:var(--mute);margin:8px 0}
.li{display:flex;align-items:center;gap:2px;padding:5px 6px;margin-bottom:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.li.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.li.off input{opacity:.5}
.li input{flex:1;min-width:0;border:0;background:none;color:inherit;font:inherit;font-weight:600;padding:4px}
.li .lab{flex:1;min-width:0;font-weight:600;padding:4px}
.li .lab small{display:block;font-weight:400;color:var(--mute);font-size:13.5px}
.li.big{padding:5px 6px}
.li.big input{font-size:16px}
.li.big .acts{display:contents}
.li.big .acts .ib{padding:4px}
.ib{display:inline-flex;align-items:center;justify-content:center;padding:4px;border:0;border-radius:6px;background:none;color:var(--mute);cursor:pointer}
.ib:hover{background:var(--line);color:var(--ink)}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.f>label,.f>.l{font-size:13.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
input[type=text],input[type=number],input[type=url],select,textarea{width:100%;padding:7px 8px;border:1.5px solid var(--inbd,var(--line));border-radius:6px;background:var(--inbg,var(--panel-2));color:var(--ink);font:inherit}
input[type=color]{width:44px;height:32px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2)}
textarea{resize:vertical;min-height:64px}
.code{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.row>input[type=color]{flex:none}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px;cursor:pointer}
.th{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.th img{width:52px;height:38px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex:none}
.th span{flex:1;font-size:13px;color:var(--mute)}
.pre{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);cursor:pointer;text-align:left;width:100%;margin-bottom:6px}
.pre .sw{display:flex;gap:0;border-radius:6px;overflow:hidden;border:1px solid var(--line)}.pre .sw i{display:block;width:34px;height:16px}
.pre.arm{border-color:var(--danger);background:var(--hdbg)}.pre.arm small{color:var(--danger);font-weight:700}
.pre:hover{border-color:var(--accent)}
.pre small{color:var(--mute)}
#stage{grid-area:stage;overflow:auto;padding:20px;min-width:0}
#frame{margin:0 auto;max-width:1440px;width:100%;background:#fff;box-shadow:0 6px 28px rgba(10,20,40,.22);min-height:200px}
#frame.m{max-width:390px}
#frame.m.tb .sec:not(.locked) .sgrip{display:none!important}
#frame.pv{box-shadow:0 6px 28px rgba(10,20,40,.22)}
#frame:not(.pv) .sec{outline:2px dashed var(--dash);outline-offset:-2px}
#frame:not(.pv) .sec.selsec{outline:2px solid var(--accent)}
#frame:not(.pv) .e:hover{outline:1px solid var(--accent)}
#frame:not(.pv) .e{cursor:move}
#frame .e.sel{outline:2px solid var(--accent)}
#frame:not(.pv) .e .frm,#frame:not(.pv) .e .frm *,#frame:not(.pv) .e .so,#frame:not(.pv) .e .doc{pointer-events:none}
#frame.m .e{cursor:pointer}
#frame .sec.dropt{background-color:rgba(29,180,232,.14)}
.hd{position:absolute;width:11px;height:11px;background:#fff;border:2px solid var(--accent);border-radius:3px;z-index:6}
.hd[data-h=e]{right:-6px;top:calc(50% - 6px);cursor:ew-resize}
.hd[data-h=s]{bottom:-6px;left:calc(50% - 6px);cursor:ns-resize}
.hd[data-h=se]{right:-6px;bottom:-6px;cursor:nwse-resize}
.etb{position:absolute;bottom:calc(100% + 8px);left:0;display:flex;align-items:center;gap:2px;padding:5px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;z-index:7;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:default;white-space:nowrap}
.etb .ib{padding:8px;border-radius:8px}
.etb.r{left:auto;right:0}
#frame.m .etb{flex-wrap:wrap;width:236px}
.etb .sep{width:1px;align-self:stretch;background:var(--line);margin:3px 4px}
.sbar{position:absolute;left:6px;top:6px;z-index:9;display:none;align-items:center;gap:2px;padding:4px 6px 4px 12px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:600 13px 'Nunito Sans',sans-serif;box-shadow:0 3px 10px rgba(0,0,0,.2);cursor:default}
.sec:hover>.sbar,.sec.selsec>.sbar,.sec.actsec>.sbar{display:flex}
.pgsel{display:flex;align-items:center;gap:8px;margin-left:14px;padding:0 6px 0 12px;height:42px;border:2px solid var(--hd);border-radius:10px;background:var(--hdbg);color:var(--hdl)}
.pgsel select{font:700 16px inherit;font-family:inherit;border:0;background:transparent;color:var(--hdl);height:40px;max-width:240px;cursor:pointer;outline:0;padding-right:4px}.pgsel option{background:var(--panel-2);color:var(--ink);font-weight:600}
.sbar{zoom:1.25}
.sbar{background:#1f2937!important;color:#fff!important;border-color:#0b1220!important}
.sbar .ib{color:#e5e7eb}.sbar .ib:hover{background:#374151;color:#fff}
.sbar .sname:has(svg){max-width:none;display:flex;align-items:center;gap:6px}
.sname{color:#fff!important;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:15px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px;margin-right:4px;border-right:1px solid var(--line)}
.fbadge{position:absolute;left:0;bottom:-18px;font:700 10px 'Nunito Sans',sans-serif;background:var(--accent);color:#06293a;padding:1px 6px;border-radius:4px;white-space:nowrap}
.empty{padding:60px 20px;text-align:center;color:#66738a;font:15px 'Nunito Sans',sans-serif}
#modal{position:fixed;inset:0;z-index:100;background:rgba(8,14,26,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
.card{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--panel-2);border-radius:14px;padding:22px;border:1px solid var(--line)}
.card h2{margin:0 0 6px;font-size:21px}
.card.cat{width:min(1100px,100%);height:90vh;padding:0;display:flex;flex-direction:column;overflow:hidden}
.cath{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line)}
.cath h2{margin:0;font-size:22px}
.catb{flex:1;display:grid;grid-template-columns:240px minmax(0,1fr);min-height:0}
.catn{overflow:auto;border-right:1px solid var(--line);background:var(--panel)}
.catn button{display:block;width:100%;text-align:left;padding:13px 22px;border:0;background:none;font:inherit;color:var(--mute);cursor:pointer}
.catn button:hover{background:var(--line);color:var(--ink)}
.catr{overflow:auto;padding:20px;background:var(--panel)}
.catg{margin-bottom:14px}
.cath2{background:var(--line);padding:12px 16px;border-radius:8px;font-weight:700;margin-bottom:12px}
.catp{display:block;position:relative;width:100%;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;cursor:pointer;text-align:left}
.catp:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.catp .catadd{position:absolute;right:12px;top:12px;background:var(--accent);color:#06293a;font-weight:700;padding:7px 14px;border-radius:8px;opacity:0;z-index:5}
.catp:hover .catadd{opacity:1}
.cap{font-size:14.5px;color:var(--mute);margin:6px 2px 22px}
.pvx{position:relative;overflow:hidden;pointer-events:none;background:#fff}
.pvx .sbar{display:none!important}
@media (max-width:760px){.catb{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}.catn{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.catn button{white-space:nowrap;width:auto}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:#1f2937;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;max-width:90vw}
#toast[hidden]{display:none}
@media (max-width:900px){
 #app{grid-template-columns:80px minmax(0,1fr);grid-template-areas:"bar bar" "rail stage"}
 #drawer,#props{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));bottom:env(safe-area-inset-bottom,0px);z-index:40;box-shadow:0 0 24px rgba(0,0,0,.35)}
 #drawer{left:80px}
 #props{right:0}
 #app.dw #drawer{width:min(350px,calc(100vw - 80px))}
 #app.pw #props{width:min(350px,100vw)}
 #stage{padding:10px}
 .lbl{display:none}
 .ri{font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div id="app">
 <div id="bar"></div>
 <nav id="rail" aria-label="Herramientas"></nav>
 <aside id="drawer" aria-label="Panel"></aside>
 <main id="stage"><div id="frame"></div></main>
 <aside id="props" aria-label="Propiedades"></aside>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="fileMulti" accept="image/*" multiple hidden>
<input type="file" id="fileDoc" hidden>
<input type="file" id="fileVid" accept="video/*" hidden>
<div id="linkpop" role="dialog" aria-label="Enlace" hidden></div>
